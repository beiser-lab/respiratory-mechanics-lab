name: Report a bug
description: Report unexpected behavior or a physiology concern.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve Respiratory Mechanics Lab. This report will be public. Please check existing issues before submitting."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem, including any unexpected physiology or graph behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and simulator settings
      description: Include the starting condition, slider settings (lung compliance, chest wall compliance, inward load, muscle strength), and the volume you were examining.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g., Safari on Mac, Chrome on Windows, iPad
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or exported CSV (optional)
      description: Attach a screenshot or simulator CSV if helpful. Include the date/time of the experiment if known.
